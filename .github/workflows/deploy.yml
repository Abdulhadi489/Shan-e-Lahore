name: Deploy to cPanel          # The name shown in the Actions tab

on:
  push:
    branches: [main]            # Run every time something is pushed to main

jobs:
  deploy:
    runs-on: ubuntu-latest      # GitHub runs this on a temporary server it provides

    steps:
      - uses: actions/checkout@v4      # Step 1: download your repo's files onto that temporary server

      # (Commented-out lines starting with # are only needed
      #  for React/Vite sites that need "npm run build" first)

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5   # Step 2: a ready-made tool that uploads over FTP
        with:
          server: ${{ secrets.FTP_SERVER }}       # Reads the secrets you added,
          username: ${{ secrets.FTP_USERNAME }}   # so the password never appears
          password: ${{ secrets.FTP_PASSWORD }}   # in the file itself
          local-dir: ./     # Which folder in the repo to upload (./ = all of it)
          server-dir: ./    # Where to put it on the hosting (./ = the FTP account's folder, i.e. your site root)
